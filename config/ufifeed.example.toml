# Предлагаемый контракт конфигурации. Парсер приложения пока не реализован.
# Значения расписания, ID и источников ниже — примеры, не настройки пользователя.

[owner]
user_id = 123456789
delivery_chat_id = 123456789

[storage]
database_path = "/app/data/ufifeed.sqlite3"
retention_days = 30

[telegram]
# api_id, api_hash и bot_token читаются из секретов, не из этого файла.
session_path = "/app/secrets/reader.session"
initial_history_hours = 24
reconcile_interval_seconds = 300

[digest]
mode = "extractive"
language = "ru"
max_items = 10
include_source_links = true
send_when_empty = false

[[sources]]
key = "news"
peer = "@example_channel"
enabled = false # Включить после замены на реальный доступный источник.
priority = 1
include_keywords = ["релиз", "обновление"]
exclude_keywords = ["#реклама"]

[[schedules]]
key = "daily"
enabled = false # Включить после выбора времени и часового пояса.
source_keys = ["news"]
timezone = "America/Los_Angeles"
times = ["09:00", "20:00"]
window = "since_previous_slot"
missed_runs = "coalesce"
