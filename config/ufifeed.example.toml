# Начальные настройки. setup привяжет user_id к основному аккаунту через одноразовый код.
# После первого запуска папка, темы, режим и расписание хранятся в SQLite
# и меняются командами бота. Этот файл остаётся конфигурацией сервера.

[owner]
user_id = 123456789

[storage]
database_path = "data/ufifeed.sqlite3"
key_path = "secrets/data.key"
retention_days = 30

[telegram]
session_path = "secrets/reader.session"
initial_history_hours = 24
reconcile_interval_seconds = 300
# folder_id = 2 # Можно выбрать позднее через /folders и /folder ID.

[digest]
max_items = 10
send_when_empty = false

[schedule]
enabled = false
timezone = "America/Los_Angeles" # Seattle
times = ["09:00", "20:00"] # Пример: фактическое время задаётся в боте.

[ai]
enabled = false
# OpenAI-compatible Chat Completions, включая самостоятельно размещённые endpoints.
base_url = "https://api.openai.com/v1"
model = ""
daily_call_limit = 20
max_input_chars = 24000
# API key — в secrets/credentials.json (ai_api_key) или переменной AI_API_KEY.
