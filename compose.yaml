name: ufifeed
services:
  app:
    build: .
    image: ufifeed:${UFIFEED_IMAGE_TAG:-local}
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 1g
    stop_grace_period: 30s
    environment:
      CODEX_HOME: /app/codex
    volumes:
      - ${UFIFEED_STATE_DIR:-.}/config:/app/config
      - ${UFIFEED_STATE_DIR:-.}/data:/app/data
      - ${UFIFEED_STATE_DIR:-.}/secrets:/app/secrets
      - ${UFIFEED_CODEX_HOME:-./codex}:/app/codex
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: [CMD, python, -m, ufifeed.healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
