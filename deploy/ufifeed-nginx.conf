# Insert inside the existing proxy's http {} block; keep existing virtual hosts intact.
# BEGIN UFIFEED
limit_req_zone $binary_remote_addr zone=ufifeed:10m rate=5r/s;
server {
    listen 80;
    server_name ufifeed.ufian.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://ufifeed.ufian.com:8443$request_uri; }
}
server {
    listen 8443 ssl;
    server_name ufifeed.ufian.com;
    ssl_certificate /etc/letsencrypt/live/ufifeed.ufian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ufifeed.ufian.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    location / {
        limit_req zone=ufifeed burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }
}
# END UFIFEED
