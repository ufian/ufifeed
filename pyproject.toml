[project]
name = "ufifeed"
version = "0.1.0"
description = "Private Telegram folder digests"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiohttp>=3.9,<4",
  "aiogram>=3.13,<4",
  "telethon>=1.36,<2",
  "cryptography>=43",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "tzdata>=2024.1",
  "qrcode>=8,<9",
]

[project.scripts]
ufifeed = "ufifeed.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
